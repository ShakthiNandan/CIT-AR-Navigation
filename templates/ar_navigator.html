<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>AR Navigator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --background-dark: rgba(17, 24, 39, 0.95);
            --text-light: #f3f4f6;
            --text-dark: #1f2937;
            --border-radius: 12px;
            --spacing: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: var(--spacing);
            z-index: 100;
            pointer-events: none;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--background-dark);
            padding: 8px 16px;
            border-radius: var(--border-radius);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-light);
        }

        /* Navigation Controls */
        .nav-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: var(--spacing);
            z-index: 100;
            pointer-events: none;
        }

        .controls-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr auto auto;
            gap: var(--spacing);
            align-items: center;
            background: var(--background-dark);
            padding: var(--spacing);
            border-radius: var(--border-radius);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 1rem;
            appearance: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select option {
            background: var(--background-dark);
            color: var(--text-light);
            padding: 12px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
            font-size: 0.8rem;
        }

        button {
            padding: 12px 24px;
            border-radius: var(--border-radius);
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }

        #distance {
            color: var(--text-light);
            font-weight: 500;
            text-align: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            min-width: 150px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .controls-container {
                grid-template-columns: 1fr;
            }

            .nav-controls {
                padding: var(--spacing);
            }

            select, button, #distance {
                width: 100%;
            }
        }

        /* Loading State */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-light);
            font-size: 1.2rem;
            z-index: 1000;
            background: var(--background-dark);
            padding: 20px 40px;
            border-radius: var(--border-radius);
            display: none;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1 class="app-title">CIT AR Navigation</h1>
            </div>
        </header>

        <!-- AR Scene -->
        <a-scene vr-mode-ui="enabled: false" embedded 
            arjs="sourceType: webcam; 
                  sourceWidth: 1280; 
                  sourceHeight: 720; 
                  debugUIEnabled: false;
                  maxDetectionRate: 30;
                  canvasWidth: 1280;
                  canvasHeight: 720;
                  imageSmoothingEnabled: false;"
            device-orientation-permission-ui="enabled: true"
            renderer="antialias: false; precision: mediump;"
            loading-screen="enabled: false">
            <a-assets>
                <a-asset-item id="arrowObj" src="/static/models/arrow.obj"></a-asset-item>
                <a-asset-item id="arrowMtl" src="/static/models/arrow.mtl"></a-asset-item>
                <a-asset-item id="pinObj" src="/static/models/pin.obj"></a-asset-item>
                <a-asset-item id="pinMtl" src="/static/models/pin.mtl"></a-asset-item>
            </a-assets>

            <!-- GPS camera -->
            <a-camera gps-camera rotation-reader></a-camera>

            <!-- Add a marker for testing -->
            <a-marker preset="hiro">
                <a-box position="0 0.5 0" material="color: red;"></a-box>
            </a-marker>
        </a-scene>

        <!-- Navigation Controls -->
        <div class="nav-controls">
            <div class="controls-container">
                <div class="select-wrapper">
                    <select id="fromSelect">
                        <option value="">Select Starting Point</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="toSelect">
                        <option value="">Select Destination</option>
                    </select>
                </div>
                <button id="goBtn">Start Navigation</button>
                <div id="distance">Distance: — m</div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="loading">Calculating route...</div>
    </div>

    <script>
        const sceneEl = document.querySelector('a-scene');
        let scenesList = [];
        const loading = document.querySelector('.loading');

        // Load scenes.json
        fetch('/scenes.json')
            .then(r => r.json())
            .then(arr => {
                scenesList = arr;
                arr.forEach((s, i) => {
                    fromSelect.append(new Option(s.title, i));
                    toSelect.append(new Option(s.title, i));
                });
            });

        // Haversine formula for distance calculation
        function haversineMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // m
            const toRad = Math.PI / 180;
            const φ1 = lat1 * toRad, φ2 = lat2 * toRad;
            const Δφ = (lat2 - lat1) * toRad;
            const Δλ = (lon2 - lon1) * toRad;
            const a = Math.sin(Δφ / 2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }

        // Calculate bearing between two points
        function computeBearing(lat1, lon1, lat2, lon2) {
            const toRad = Math.PI / 180, toDeg = 180 / Math.PI;
            const φ1 = lat1 * toRad, φ2 = lat2 * toRad;
            const Δλ = (lon2 - lon1) * toRad;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            return (Math.atan2(y, x) * toDeg + 360) % 360;
        }

        // Clear existing navigation elements
        function clearNav() {
            const entities = document.querySelectorAll('.nav-arrow, .nav-pin');
            entities.forEach(entity => {
                if (entity.object3D) {
                    entity.object3D.traverse((object) => {
                        if (object.geometry) {
                            object.geometry.dispose();
                        }
                        if (object.material) {
                            if (Array.isArray(object.material)) {
                                object.material.forEach(material => material.dispose());
                            } else {
                                object.material.dispose();
                            }
                        }
                    });
                }
                entity.parentNode.removeChild(entity);
            });
        }

        // Start navigation with loading state
        async function startNavigation() {
            const fi = +fromSelect.value, ti = +toSelect.value;
            if (isNaN(fi) || isNaN(ti)) {
                alert('Please select both starting point and destination');
                return;
            }

            loading.classList.add('active');
            clearNav();

            try {
                // Fetch multi-hop path
                const res = await fetch(`/api/route?from=${fi}&to=${ti}`);
                const path = await res.json();
                if (!Array.isArray(path) || path.length < 2) {
                    throw new Error('Invalid route data');
                }

                // Compute total distance
                let totalDist = 0;
                for (let i = 0; i < path.length - 1; i++) {
                    totalDist += haversineMeters(
                        path[i].latitude, path[i].longitude,
                        path[i + 1].latitude, path[i + 1].longitude
                    );
                }
                distance.innerText = `Distance: ${totalDist.toFixed(0)} m`;

                // Create a document fragment for batch DOM updates
                const fragment = document.createDocumentFragment();

                // Place pins at endpoints
                [0, path.length - 1].forEach(idx => {
                    const n = path[idx];
                    const pin = document.createElement('a-entity');
                    pin.setAttribute('gps-entity-place',
                        `latitude: ${n.latitude}; longitude: ${n.longitude};`);
                    pin.setAttribute('obj-model', 'obj: #pinObj; mtl: #pinMtl');
                    pin.setAttribute('position', '0 -0.5 0');
                    pin.setAttribute('scale', '5 5 5');
                    pin.classList.add('nav-pin');
                    fragment.appendChild(pin);
                });

                // Place arrows along the path with optimized spacing
                const spacing = 30; // Increased spacing to reduce number of arrows
                for (let i = 0; i < path.length - 1; i++) {
                    const A = path[i], B = path[i + 1];
                    const segDist = haversineMeters(A.latitude, A.longitude, B.latitude, B.longitude);
                    const steps = Math.max(1, Math.floor(segDist / spacing));
                    const bearing = computeBearing(
                        A.latitude, A.longitude,
                        B.latitude, B.longitude
                    );
                    
                    // Only place arrows at key points
                    for (let s = 0; s <= steps; s += 2) {
                        const f = s / steps;
                        const lat = A.latitude + (B.latitude - A.latitude) * f;
                        const lon = A.longitude + (B.longitude - A.longitude) * f;
                        const arrow = document.createElement('a-entity');
                        arrow.setAttribute('gps-entity-place',
                            `latitude: ${lat}; longitude: ${lon};`);
                        arrow.setAttribute('obj-model', 'obj: #arrowObj; mtl: #arrowMtl');
                        arrow.setAttribute('rotation', `0 ${bearing} 0`);
                        arrow.setAttribute('position', '0 -0.5 0');
                        arrow.setAttribute('scale', '5 5 5');
                        arrow.classList.add('nav-arrow');
                        fragment.appendChild(arrow);
                    }
                }

                // Batch append all entities at once
                sceneEl.appendChild(fragment);

            } catch (error) {
                console.error('Navigation error:', error);
                alert('Error calculating route. Please try again.');
            } finally {
                loading.classList.remove('active');
            }
        }

        // Event Listeners
        goBtn.addEventListener('click', startNavigation);
    </script>
</body>

</html>
