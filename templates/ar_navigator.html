<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>AR Navigator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* full viewport height */
        }

        header {
            flex: 0 0 50px;
            /* fixed 50px tall */
            line-height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            text-align: center;
            font-size: 1.2em;
            z-index: 10;
        }

        #scene-container {
            flex: 1 1 auto;
            /* fill remaining space */
            position: relative;
            overflow: hidden;
            /* crop the scene to this box */
        }

        #scene-container a-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        footer {
            flex: 0 0 100px;
            /* fixed 100px tall */
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px;
            z-index: 10;
        }

        footer select,
        footer button {
            font-size: 1em;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            min-width: 100px;
        }

        footer select {
            background: #fff;
            color: #000;
        }

        footer button {
            background: #1e90ff;
            color: #fff;
            cursor: pointer;
        }

        footer #distance {
            color: #fff;
            font-weight: 500;
            min-width: 120px;
            text-align: center;
        }

        @media (max-width: 480px) {
            footer {
                flex-direction: column;
            }

            footer select,
            footer button {
                width: 80%;
            }
        }


        /* target the AR.js video & force it to cover the container */
        .arjs-video,
        #scene-container video {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            /* or “contain” if you prefer letter‑boxing */
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- 1) Header -->
        <header>CIT AR Navigation</header>

        <!-- 2) AR scene -->
        <div id="scene-container">
            <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;"
                device-orientation-permission-ui="enabled: true">
                <a-assets>
                    <a-asset-item id="arrowObj" src="/static/models/arrow.obj"></a-asset-item>
                    <a-asset-item id="arrowMtl" src="/static/models/arrow.mtl"></a-asset-item>
                    <a-asset-item id="pinObj" src="/static/models/pin.obj"></a-asset-item>
                    <a-asset-item id="pinMtl" src="/static/models/pin.mtl"></a-asset-item>
                </a-assets>

                <!-- GPS camera -->
                <a-camera gps-camera rotation-reader></a-camera>
            </a-scene>
        </div>

        <!-- 3) Footer UI -->
        <footer>
            <select id="fromSelect">
                <option value="">From</option>
            </select>
            <select id="toSelect">
                <option value="">To</option>
            </select>
            <button id="goBtn">Go</button>
            <div id="distance">Distance: — m</div>
        </footer>
    </div>

    <script>
        const sceneEl = document.querySelector('a-scene');
        let scenesList = [];

        // 1) load scenes.json
        fetch('/scenes.json')
            .then(r => r.json())
            .then(arr => {
                scenesList = arr;
                arr.forEach((s, i) => {
                    fromSelect.append(new Option(s.title, i));
                    toSelect.append(new Option(s.title, i));
                });
            });

        // 2) haversine (meters)
        function haversineMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // m
            const toRad = Math.PI / 180;
            const φ1 = lat1 * toRad, φ2 = lat2 * toRad;
            const Δφ = (lat2 - lat1) * toRad;
            const Δλ = (lon2 - lon1) * toRad;
            const a = Math.sin(Δφ / 2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }

        // 3) bearing
        function computeBearing(lat1, lon1, lat2, lon2) {
            const toRad = Math.PI / 180, toDeg = 180 / Math.PI;
            const φ1 = lat1 * toRad, φ2 = lat2 * toRad;
            const Δλ = (lon2 - lon1) * toRad;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            return (Math.atan2(y, x) * toDeg + 360) % 360;
        }

        // 4) clear old nav
        function clearNav() {
            document.querySelectorAll('.nav-arrow, .nav-pin').forEach(el => el.remove());
        }

        // 5) route + rendering
        async function startNavigation() {
            clearNav();
            const fi = +fromSelect.value, ti = +toSelect.value;
            if (isNaN(fi) || isNaN(ti)) return;

            // fetch multi-hop path
            const res = await fetch(`/api/route?from=${fi}&to=${ti}`);
            const path = await res.json();
            if (!Array.isArray(path) || path.length < 2) return;

            // compute total distance
            let totalDist = 0;
            for (let i = 0; i < path.length - 1; i++) {
                totalDist += haversineMeters(
                    path[i].latitude, path[i].longitude,
                    path[i + 1].latitude, path[i + 1].longitude
                );
            }
            distance.innerText = `Distance: ${totalDist.toFixed(0)} m`;

            // place pins at endpoints
            [0, path.length - 1].forEach(idx => {
                const n = path[idx];
                const pin = document.createElement('a-entity');
                pin.setAttribute('gps-entity-place',
                    `latitude: ${n.latitude}; longitude: ${n.longitude};`);
                pin.setAttribute('obj-model', 'obj: #pinObj; mtl: #pinMtl');
                pin.setAttribute('position', '0 -1.2 0');
                pin.setAttribute('scale', '1.8 1.8 1.8');
                pin.classList.add('nav-pin');
                sceneEl.appendChild(pin);
            });

            // arrows every 5 m
            const spacing = 15; // meters
            for (let i = 0; i < path.length - 1; i++) {
                const A = path[i], B = path[i + 1];
                const segDist = haversineMeters(A.latitude, A.longitude, B.latitude, B.longitude);
                const steps = Math.max(1, Math.floor(segDist / spacing));
                const bearing = computeBearing(
                    A.latitude, A.longitude,
                    B.latitude, B.longitude
                );
                for (let s = 0; s <= steps; s++) {
                    const f = s / steps;
                    const lat = A.latitude + (B.latitude - A.latitude) * f;
                    const lon = A.longitude + (B.longitude - A.longitude) * f;
                    const arrow = document.createElement('a-entity');
                    arrow.setAttribute('gps-entity-place',
                        `latitude: ${lat}; longitude: ${lon};`);
                    arrow.setAttribute('obj-model', 'obj: #arrowObj; mtl: #arrowMtl');
                    arrow.setAttribute('rotation', `0 ${bearing} 0`);
                    arrow.setAttribute('position', '0 -1.2 0');
                    arrow.setAttribute('scale', '1.5 1.5 1.5');
                    arrow.setAttribute('material', 'shader: flat; color: blue');
                    arrow.classList.add('nav-arrow');
                    sceneEl.appendChild(arrow);
                }
            }
        }

        goBtn.addEventListener('click', startNavigation);
    </script>
</body>

</html>
