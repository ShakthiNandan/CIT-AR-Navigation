<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AR Navigator</title>

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .nav-controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 90%;
            max-width: 500px;
        }

        .controls-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .select-wrapper {
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background-color: white;
            font-size: 16px;
            color: #333;
            transition: border-color 0.3s ease;
            margin-bottom: 10px;
        }

        select:focus {
            border-color: #2196F3;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1976D2;
        }

        #distance {
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 18px;
            display: none;
            z-index: 1000;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>

<body>

        <!-- Navigation Controls -->
        <div class="nav-controls">
            <div class="controls-container">
                <div class="select-wrapper">
                    <select id="fromSelect">
                        <option value="">Select Starting Point</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="toSelect">
                        <option value="">Select Destination</option>
                    </select>
                </div>
                <button id="goBtn">Start Navigation</button>
                <div id="distance">Distance: — m</div>
            </div>
        </div>

    <!-- AR Scene -->
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;"
        device-orientation-permission-ui="enabled: true">
        <a-assets>
            <a-asset-item id="arrowObj" src="/static/models/arrow.obj"></a-asset-item>
            <a-asset-item id="arrowMtl" src="/static/models/arrow.mtl"></a-asset-item>
            <a-asset-item id="pinObj" src="/static/models/pin.obj"></a-asset-item>
            <a-asset-item id="pinMtl" src="/static/models/pin.mtl"></a-asset-item>
        </a-assets>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <!-- Loading Indicator -->
    <div class="loading">Calculating route...</div>
    <script>
        const sceneEl = document.querySelector('a-scene');
        let scenesList = [];

        // Haversine formula for distance calculation
        function haversineMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // m
            const toRad = Math.PI / 180;
            const φ1 = lat1 * toRad, φ2 = lat2 * toRad;
            const Δφ = (lat2 - lat1) * toRad;
            const Δλ = (lon2 - lon1) * toRad;
            const a = Math.sin(Δφ / 2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }

        const loading = document.querySelector('.loading');
        // 1) Load scenes.json and populate dropdowns
        fetch('/scenes.json')
            .then(r => r.json())
            .then(arr => {
                scenesList = arr;
                arr.forEach((s, i) => {
                    const o1 = new Option(s.title, i);
                    const o2 = new Option(s.title, i);
                    document.getElementById('fromSelect').append(o1);
                    document.getElementById('toSelect').append(o2);
                });
            });

        // 2) Bearing formula (to rotate arrow toward next point)
        function computeBearing(lat1, lon1, lat2, lon2) {
            const toRad = Math.PI / 180, toDeg = 180 / Math.PI;
            const φ1 = lat1 * toRad, φ2 = lat2 * toRad;
            const Δλ = (lon2 - lon1) * toRad;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            return (Math.atan2(y, x) * toDeg + 360) % 360;
        }

        // Clear existing navigation elements
        function clearNav() {
            document.querySelectorAll('.nav-arrow, .nav-pin').forEach(el => el.remove());
        }

        // Start navigation with loading state
        async function startNavigation() {
            const fi = +fromSelect.value, ti = +toSelect.value;
            if (isNaN(fi) || isNaN(ti)) {
                alert('Please select both starting point and destination');
                return;
            }

            loading.classList.add('active');
            clearNav();

            try {
                // Fetch path from backend A* implementation
                const res = await fetch(`/api/route?from=${fi}&to=${ti}`);
                if (!res.ok) {
                    throw new Error('Failed to fetch route');
                }
                const path = await res.json();
                
                if (!Array.isArray(path) || path.length < 2) {
                    throw new Error('Invalid route data');
                }

                // Compute total distance
                let totalDist = 0;
                console.log('Navigation Path (A* over KNN graph):');
                console.log('----------------');
                for (let i = 0; i < path.length - 1; i++) {
                    const currentPoint = path[i];
                    const nextPoint = path[i + 1];
                    const segmentDist = haversineMeters(
                        currentPoint.latitude, currentPoint.longitude,
                        nextPoint.latitude, nextPoint.longitude
                    );
                    totalDist += segmentDist;
                    
                    console.log(`Point ${i + 1}:`);
                    console.log(`  Location: ${currentPoint.title}`);
                    console.log(`  Coordinates: (${currentPoint.latitude.toFixed(6)}, ${currentPoint.longitude.toFixed(6)})`);
                    console.log(`  Distance to next point: ${segmentDist.toFixed(2)}m`);
                    console.log('----------------');
                }
                
                // Log final point
                const finalPoint = path[path.length - 1];
                console.log(`Final Point:`);
                console.log(`  Location: ${finalPoint.title}`);
                console.log(`  Coordinates: (${finalPoint.latitude.toFixed(6)}, ${finalPoint.longitude.toFixed(6)})`);
                console.log(`Total Distance: ${totalDist.toFixed(2)}m`);
                console.log('----------------');
                
                distance.innerText = `Distance: ${totalDist.toFixed(0)} m`;

                // Place pins at endpoints
                [0, path.length - 1].forEach(idx => {
                    const n = path[idx];
                    const pin = document.createElement('a-entity');
                    pin.setAttribute('gps-entity-place',
                        `latitude: ${n.latitude}; longitude: ${n.longitude};`);
                    pin.setAttribute('obj-model', 'obj: #pinObj; mtl: #pinMtl');
                    pin.setAttribute('position', '0 0 0');
                    pin.setAttribute('scale', '2.5 2.5 2.5');
                    pin.classList.add('nav-pin');
                    sceneEl.appendChild(pin);
                });

                // Place arrows along the path with optimized spacing
                const spacing = 30; // Increased spacing to reduce number of arrows
                for (let i = 0; i < path.length - 1; i++) {
                    const A = path[i], B = path[i + 1];
                    const segDist = haversineMeters(A.latitude, A.longitude, B.latitude, B.longitude);
                    const steps = Math.max(1, Math.floor(segDist / spacing));
                    const bearing = computeBearing(
                        A.latitude, A.longitude,
                        B.latitude, B.longitude
                    );

                    // Only place arrows at key points
                    for (let s = 0; s <= steps; s += 2) {
                        const f = s / steps;
                        const lat = A.latitude + (B.latitude - A.latitude) * f;
                        const lon = A.longitude + (B.longitude - A.longitude) * f;
                        const arrow = document.createElement('a-entity');
                        arrow.setAttribute('gps-entity-place',
                            `latitude: ${lat}; longitude: ${lon};`);
                        arrow.setAttribute('obj-model', 'obj: #arrowObj; mtl: #arrowMtl');
                        arrow.setAttribute('rotation', `0 ${bearing} 0`);
                        arrow.setAttribute('position', '0 0 0');
                        arrow.setAttribute('scale', '2.0 2.0 2.0');
                        arrow.classList.add('nav-arrow');
                        sceneEl.appendChild(arrow);
                    }
                }

                // Add a camera position listener to adjust component heights
                
            } catch (error) {
                console.error('Navigation error:', error);
                alert('Error calculating route. Please try again.');
            } finally {
                loading.classList.remove('active');
            }
        }

        // Event Listeners
        goBtn.addEventListener('click', startNavigation);
    </script>

</body>

</html>
